name: lets_connect_app
description: "Anonymous 1-on-1 Emotional Support & Voice Calling App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Real-Time Voice Calling
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1

  # Networking & State
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4

  # UI & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
