# Local-only integration doubles. Do not activate the dev profile on a public deployment.
spring:
  datasource:
    url: jdbc:h2:mem:connecto_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

jwt:
  secret: local-development-only-jwt-secret-change-before-deploy-0123456789

agora:
  app-id: dev-mock-app-id
  app-certificate: dev-mock-app-certificate

integrations:
  mock:
    voice: true
    play-billing: true
