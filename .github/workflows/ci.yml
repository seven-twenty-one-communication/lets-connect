name: Connecto CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend (Spring Boot & Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: letsconnect-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit & Integration Tests
        run: ./gradlew test --no-daemon

  admin-typecheck:
    name: Admin Web (Next.js & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: letsconnect-admin
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: letsconnect-admin/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run type-check

  mobile-typecheck:
    name: Mobile App (React Native & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: letsconnect-mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: letsconnect-mobile/package.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run type-check
